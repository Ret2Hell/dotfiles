[settings]
dotfiles.root = "~/dotfiles"

# Each group mirrors $HOME. Only files in Git's index are deployed.
# target = "~" and mode = "symlink-each" are the defaults.
[dotfile_groups.git]
root = "git"
manifest = "git"

[dotfile_groups.herdr]
root = "herdr"
manifest = "git"
exclude = ["*.log", "session.json", "release-notes.json"]

[dotfile_groups.hypr]
root = "hypr"
manifest = "git"

[dotfile_groups.kitty]
root = "kitty"
manifest = "git"

[dotfile_groups.nvim]
root = "nvim"
manifest = "git"

[dotfile_groups.omarchy]
root = "omarchy"
manifest = "git"

[dotfile_groups.opencode]
root = "opencode"
manifest = "git"

[dotfile_groups.scripts]
root = "scripts"
manifest = "git"

[dotfile_groups.spicetify]
root = "spicetify"
manifest = "git"

[dotfile_groups.yazi]
root = "yazi"
manifest = "git"

[dotfile_groups.zsh]
root = "zsh"
manifest = "git"
