onboarding = false
[theme]
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

help = "prefix+?"
detach = "prefix+q"
reload_config = "prefix+shift+q"

new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+d"
previous_workspace = "alt+up"
next_workspace = "alt+down"

new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
switch_tab = "alt+1..9"

focus_pane_left = ["prefix+left", "ctrl+alt+left"]
focus_pane_down = ["prefix+down", "ctrl+alt+down"]
focus_pane_up = ["prefix+up", "ctrl+alt+up"]
focus_pane_right = ["prefix+right", "ctrl+alt+right"]
split_vertical = "prefix+v"
split_horizontal = "prefix+h"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+z"
copy_mode = ["prefix+[", "ctrl+shift+f"]
toggle_sidebar = "prefix+b"
remove_worktree = "prefix+shift+x"

[ui]
mouse_capture = true
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
accent = "blue"
pane_scrollbars = false

agent_panel_sort = "spaces"

# kill-window and kill-session never asked
confirm_close = false

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false

[advanced]
scrollback_limit_bytes = 50000000

[[keys.command]]
key = "prefix+j"
type = "popup"
command = "jiratui"
description = "run jiratui"
width = "80%"
height = "80%"
